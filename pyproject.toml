[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "manipulation-kit"
version = "0.16.0"
description = "D1 manipulation kit: IK, URDF/description build, motion guard, end-effector configs, world views and manipulation primitives (pure computation; hardware via d1-firmwared)"
readme = "README.md"
authors = [{ name = "Omakase Robotics" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
requires-python = ">=3.9"
dependencies = [
    # EVERYTHING the kit computes runs on these two. The arm math — inverse
    # kinematics included — is numpy plus scipy rotations over the URDF this
    # package ships (manipulation_kit.arms.urdf_chain). The motion guard
    # deliberately needs NEITHER: it is stdlib-only, so it can be imported
    # anywhere, including a bare planner or a firmware-side test host.
    "numpy",
    "scipy>=1.7",
]

[project.optional-dependencies]
# MuJoCo. NOT needed to use this package: the default IK substrate is
# manipulation_kit.arms.urdf_chain.UrdfChain (numpy), and nothing under
# manipulation_kit.arms imports mujoco at module scope. Install this extra for
#
#   * the ALTERNATIVE IK substrate, get_arm_kinematics("d1/arm", chain="mujoco"),
#     which exists for consumers that already keep a MuJoCo mirror of the robot
#     (dx-vr-teleop: viewer + sim backend + composed hand model) and want the
#     solver driving THAT model rather than a second one;
#   * the research and preview code outside the wheel — contrib/wholebody/
#     (whole-body IK demos) and examples/ (gesture preview, click-to-move);
#   * the tests that cross-check the two substrates against each other
#     (tests/arms/test_urdf_chain_parity.py) or load the DH116S MJCF.
#
# Everything else in the suite runs, and passes, without it.
#
# The 3.9 ceiling is not a preference: MuJoCo stopped shipping cp39 wheels after
# 3.3.7, and without the marker pip tries to BUILD it from source and dies on a
# missing MUJOCO_PATH. 3.9 is the floor this package declares because that is
# what the robot images run, so the pin has to be real.
mujoco = [
    "mujoco>=3.0,<=3.3.7; python_version < '3.10'",
    "mujoco>=3.0; python_version >= '3.10'",
]
# The ONE package in this project that opens a socket:
# manipulation_kit.executors.firmware, which runs a planned primitive on a real
# D1 through the d1-firmwared REST daemon. It is an extra so the base install
# keeps the repository's no-socket promise, and nothing else here imports it.
#
# These three are the RUNTIME DEPENDENCIES OF THE GENERATED CLIENT that ships
# inside the package (executors/firmware/_client/d1fw_api, emitted by
# openapi-python-client) — httpx for the transport, attrs for the models,
# typing_extensions for `Self` on Python 3.10. That is the whole list, and it
# is deliberately a list of PUBLISHED packages: there is no `d1fw-client` here
# and no git URL, because a wheel whose metadata points at an unpublished
# repository is not installable by the people this repository is public for.
#
# `uv` is NOT here either, and must not be. It is an OPTIONAL RUNTIME TOOL: it
# is what lets a robot regenerate the client on the spot when the daemon's
# OpenAPI document has moved past the bundled snapshot (it provisions the
# Python 3.11 the generator needs, which the robots do not have). Without it
# the bundled client is used with a warning. Installing a developer toolchain
# as a package dependency would be the wrong trade in both directions.
firmware = ["httpx>=0.23", "attrs>=21.3", "typing_extensions>=4.0"]
# Mesh work: the CAD vendoring/decimation tools under tools/vendoring/ (which
# are outside the wheel, and need the private assets repository — see
# tools/vendoring/README.md).
meshes = ["trimesh", "fast-simplification"]
# Reading an image. NOT a dependency of the package: manipulation_kit.perception
# models cameras and measures pixels, but nothing under manipulation_kit opens
# a camera or decodes a frame, and that stays true — it takes (H, W, 3) arrays.
# examples/agent/perceive.py, the CLI that feeds it one head frame from a
# file, needs a decoder, and this is the small, pure-wheel one. OpenCV works
# too if a robot already has it (d1-inference does); perceive.py takes
# whichever is installed.
perception = ["pillow"]
# yourdfpy is a TEST dependency, not a runtime one: two gripper tests load the
# vendor URDF through a third-party parser to confirm our own reading of it is
# not the only reading. Without it they skip, and a skipped cross-check is not
# a cross-check.
#
# `pillow` is here for the same reason: the perception tests measure
# five real frames of the d1-2 wagon against the numbers that came off them on
# the night they were taken, and a suite that SKIPS that because it cannot
# open a JPEG is a suite that stopped checking the thing it exists to check.
dev = ["pytest", "yourdfpy", "pillow"]

[project.scripts]
mkit-urdf = "manipulation_kit.description.cli:main"
mkit-toolconfig = "manipulation_kit.hands.cli:main"
# Maintainer tool: regenerate the committed d1-firmwared client snapshot from a
# daemon or from a spec file. Consumers never need it — their client self-heals
# into ~/.cache at connect time.
mkit-firmware-client = "manipulation_kit.executors.firmware.cli:main"
# Teach omakaseos gestures by hand over d1-firmwared (docs/teach.md).
mkit-teach = "manipulation_kit.teach.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
# Only src/ is packaged. contrib/, examples/ and tools/ are deliberately
# top-level and outside the wheel: research demos, runnable examples and CAD
# vendoring are not things a consumer imports, and two of the three need
# either mujoco or assets that are not in this repository.
where = ["src"]

[tool.setuptools.package-data]
# Assets resolve package-relative (importlib.resources / __file__), never from
# a $D1_SDK_DIR checkout, so they MUST ship inside the wheel.
#
# The mesh globs below match NOTHING in a clean checkout — the CAD is not in
# this repository (LICENSE-STATUS.md), so a wheel built from a clean tree
# carries no CAD, which is the default and the one that may be published. They
# are kept so that an INTERNAL wheel built after `mkit-urdf fetch-assets` is
# complete. Do not build a public wheel from a fetched work tree: run
# `git clean -xdf` first, or build from a fresh clone.
"manipulation_kit.config" = ["*.json", "tool_configs/*.json", "tool_configs/*.md"]
"manipulation_kit.description" = [
    # the omakase.camera_calibration/2 JSON Schema (description.camera_calibration).
    # A SCHEMA ships; per-robot VALUES never do — they live on the robot.
    "schemas/*.schema.json",
    "d1/*.urdf", "d1/*.xml", "d1/*.md", "d1/CMakeLists.txt",
    "d1/meshes/body/*", "d1/meshes/gripper/*", "d1/meshes/body_hifi/*",
    "d1_yubi_description_v2/*.xml", "d1_yubi_description_v2/*.md",
    "d1_yubi_description_v2/urdf/*", "d1_yubi_description_v2/config/*",
    "d1_arm/*.md",
    "d1_arm/left/*", "d1_arm/left/meshes/*",
    "d1_arm/right/*", "d1_arm/right/meshes/*",
    "d1_arm/yubi_description/*",
    "d1_arm/yubi_description/meshes/*",
    "d1_arm/yubi_description/urdf/*",
    "d1_arm/yubi_description/rviz/*",
]
"manipulation_kit.hands.d1.parallel_gripper" = [
    "descriptions/*.urdf", "descriptions/README.md", "descriptions/meshes/*.STL",
]
"manipulation_kit.hands.leadshine.dh116s" = [
    "README.md", "data/*.csv",
    "descriptions/*.xml", "descriptions/README.md", "descriptions/meshes/*.STL",
]
"manipulation_kit.hands.linkerbot.o30" = ["README.md"]
# The bundled d1-firmwared client is generated CODE (found by packages.find on
# its own __init__.py files), but the two non-Python files beside it have to be
# named: the OpenAPI document it was generated from and the snapshot metadata.
# Without them a wheel could not tell whether the daemon in front of it serves
# the same document — which is the entire point of shipping them.
"manipulation_kit.executors.firmware._client" = ["SNAPSHOT.json", "openapi/*.json"]
# The generator config travels too: regeneration happens at RUNTIME on a robot,
# from the installed wheel, not from a checkout.
"manipulation_kit.executors.firmware._gen" = ["config.yaml"]

[tool.pytest.ini_options]
# Test files live in tests/<area>/ with no __init__.py, so two areas cannot both
# have a test_description.py under pytest's default (prepend) import mode — the
# basenames collide as top-level module names. importlib mode gives each file
# its own module.
addopts = "--import-mode=importlib"
testpaths = ["tests"]
