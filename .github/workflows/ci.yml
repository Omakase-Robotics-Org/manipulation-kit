name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor declared in pyproject (robots run old images);
        # 3.12 is what a fresh install gets. Both, or the floor rots.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # [mujoco] pulls the optional IK substrate: without it the
        # d1/arm kinematics tests silently skip, and a green run that
        # skipped the IK is not a green run.
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[mujoco,dev]'
      - name: Tests
        # -rs on purpose: this runner has no CAD (it is not in this
        # repository — LICENSE-STATUS.md), so the checks that OPEN a mesh skip
        # themselves and the summary has to SAY which. A run that is green
        # because it quietly tested nothing is the failure mode. To run them,
        # add MKIT_ASSETS_DIR pointing at a manipulation-kit-assets checkout.
        run: pytest -q -rs
      - name: The URDFs are what the generator emits
        run: |
          mkit-urdf build
          git diff --exit-code -- src/manipulation_kit/description
      - name: No unlicensed CAD has come back
        # The history was rewritten to remove it (2026-09-10). This is the
        # gate that stops it returning one convenient copy at a time.
        run: pytest -q tests/test_no_vendor_cad.py

      - name: The committed dist/ exports have not drifted
        run: |
          mkit-urdf export d1-collision --dest dist/d1-collision --check
          mkit-urdf export d1-wholebody-gripper --dest dist/d1-wholebody-gripper --check
      - name: Import with nothing but the package
        # The guard must load its URDF from inside the install — no checkout,
        # no $D1_SDK_DIR. Run from / so a stray relative path cannot save it.
        run: cd / && python -c "import manipulation_kit.arms, manipulation_kit.guard; from manipulation_kit.guard import MotionGuard; MotionGuard(); print('ok')"

  version-bump:
    # Consumers pin this repository by COMMIT; pip decides whether to reinstall
    # by VERSION. A change that moves what consumers import while leaving
    # project.version at 0.1.0 therefore installs "successfully" on a robot and
    # changes nothing — which is how d1-2 came up with
    # `ModuleNotFoundError: manipulation_kit.arms.d1` on 2026-09-09 from three
    # freshly pulled, freshly reinstalled checkouts.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # This gate is a DIFF against the base branch. The default depth-1
          # checkout has no base commit on disk to diff against, and the check
          # would skip itself on every run.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: A change consumers must pick up carries a version bump
        # stdlib only, and no install step: the gate has to be able to run even
        # when the package itself does not build.
        run: python tools/check_version_bump.py
