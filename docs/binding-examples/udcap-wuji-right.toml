# A UDCAP data glove (right) driving a Wuji Hand 2 (right): the fingers 1:1 in
# radians, the thumb 1:1 blended towards a pinch as the thumb opposes.
# The same table as manipulation_kit.hands.wuji.wujihand2.udcap.udcap_config().
schema = "omakase.binding.v1"

[[source]]
device = "udcap"                        # the native driver's device id (one stream, both
                                        # gloves; `--device-id` overrides it). Through
                                        # HDService it is "<role>@<udp port>", e.g. "omakase@5555"
family = "teleop_gloves.pose_stream.v1"

[[bind]]
from     = "udcap"
to       = "hand/right"
retarget = "wuji/wujihand2"

[bind.retarget_config]
mapping        = "absolute"             # the glove's angle IS the joint angle
thumb_absolute = true                   # the thumb reads the glove's thumb angles
# The pinch-aware thumb: as thumb_cm_pitch rises from pinch_open_rad to
# pinch_closed_rad, the thumb moves from the 1:1 thumb to the one that meets
# the Wuji's index tip. Per operator: put your own open-hand and pinch
# readings of thumb_cm_pitch here. thumb_pinch = false is the plain 1:1 thumb.
thumb_pinch        = true
pinch_channel      = "thumb_cm_pitch"
pinch_open_rad     = 0.15
pinch_closed_rad   = 0.30
pinch_max_step_rad = 0.1                # rad per call, per thumb joint
# Joint order: thumb S1..S4, index, middle, ring, pinky (S1..S4 each).
# middle_S2 is held at 0 rad (hold_rad is 0 for every joint): the glove's
# spreads are measured against the middle finger, and its own is computed.
hold = [false, false, false, false,
        false, false, false, false,
        false, true,  false, false,
        false, false, false, false,
        false, false, false, false]

[bind.retarget_config.joints.thumb_S1]
sources = { thumb_cm_pitch = 1.0 }
[bind.retarget_config.joints.thumb_S2]
sources = { thumb_cm_yaw = 1.0 }        # sign +1 is unverified on a hand: invert = true flips it
[bind.retarget_config.joints.thumb_S3]
sources = { thumb_mp_pitch = 1.0 }
[bind.retarget_config.joints.thumb_S4]
sources = { thumb_ip_pitch = 1.0 }
